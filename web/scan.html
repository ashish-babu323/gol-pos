<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scan for Gol POS</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #0b1526; color: #eef3fb;
         display: flex; justify-content: center; padding: 22px 16px; }
  .wrap { width: 100%; max-width: 430px; }
  h1 { font-size: 21px; margin: 4px 0 2px; }
  p.sub { color: #9db2cf; font-size: 14px; margin: 0 0 18px; line-height: 1.45; }
  .modes { display: flex; gap: 10px; margin-bottom: 16px; }
  .modes button { flex: 1; padding: 14px 8px; font-size: 16px; font-weight: 700; border-radius: 12px;
                  border: 1px solid #33507e; background: #12233f; color: #cfe0f5; cursor: pointer; }
  .modes button.on { background: #2f6df6; border-color: #2f6df6; color: #fff; }
  label.snap { display: block; text-align: center; background: #2f6df6; color: #fff; font-weight: 800;
               font-size: 18px; padding: 18px 12px; border-radius: 14px; cursor: pointer; }
  .reply { margin-top: 18px; background: #12233f; border: 1px solid #33507e; border-radius: 12px;
           padding: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
  .reply:empty { display: none; }
  .codebox { display: flex; gap: 8px; margin-bottom: 14px; }
  .codebox input { flex: 1; font-size: 19px; letter-spacing: 3px; text-transform: uppercase;
                   padding: 12px; border-radius: 10px; border: 1px solid #33507e;
                   background: #0e1d33; color: #fff; }
  .codebox button { padding: 12px 16px; font-size: 15px; font-weight: 700; border-radius: 10px;
                    border: none; background: #2f6df6; color: #fff; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Scan for the register</h1>
  <p class="sub">Take a photo here and it lands in the register's Gol chat — a bill stages there for the owner's "gol". This link is the register's camera for about 10 minutes.</p>

  <div id="codeRow" class="hidden">
    <div class="codebox">
      <input id="codeInput" type="text" maxlength="6" placeholder="CODE" autocomplete="off">
      <button id="codeBtn" type="button">Connect</button>
    </div>
  </div>

  <div id="main" class="hidden">
    <div class="modes" role="group" aria-label="What is the photo?">
      <button type="button" id="modeBill" class="on">📄 Bill / invoice</button>
      <button type="button" id="modePhoto">🖼️ Photo</button>
    </div>
    <label class="snap">📸 Take the photo
      <input id="file" type="file" accept="image/*" capture="environment" hidden>
    </label>
  </div>

  <div class="reply" id="reply"></div>
</div>
<script src="scan.js?v=1"></script>
</body>
</html>
