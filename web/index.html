<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gol POS — Register</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="ring">G</span> Gol POS <span class="store-name" id="storeName">Register</span></div>
  <div class="top-actions">
    <span class="today" id="todayTotal">Today: $0.00</span>
    <button id="ownerBtn" type="button">Owner</button>
    <button id="golBtn" type="button" class="gol-btn">Talk to Gol</button>
  </div>
</header>

<main class="layout">
  <section class="catalog">
    <div class="scan-row">
      <input id="scanInput" type="text" inputmode="numeric" placeholder="Scan or type barcode, then Enter" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search products" autocomplete="off">
    </div>
    <div class="cats" id="catRow"></div>
    <div class="grid" id="grid"></div>
  </section>

  <aside class="cart">
    <h2>Current sale</h2>
    <div id="cartLines" class="cart-lines"><p class="empty">Cart is empty — tap a product or scan.</p></div>
    <div class="totals">
      <div><span>Subtotal</span><b id="subTotal">$0.00</b></div>
      <div><span>Tax</span><b id="taxTotal">$0.00</b></div>
      <div class="grand"><span>Total</span><b id="grandTotal">$0.00</b></div>
    </div>
    <div class="tender">
      <button id="cashBtn" type="button">Cash</button>
      <button id="cardBtn" type="button">Card</button>
      <button id="clearBtn" type="button" class="ghost">Clear</button>
    </div>
  </aside>
</main>

<section class="owner hidden" id="ownerPanel">
  <h2>Owner — today</h2>
  <div id="ownerBody">Loading…</div>
  <button id="ownerClose" type="button" class="ghost">Close</button>
</section>

<div class="receipt hidden" id="receiptModal"><div class="receipt-card">
  <h3>Receipt</h3><pre id="receiptBody"></pre>
  <button id="receiptClose" type="button">New sale</button>
</div></div>

<div class="chat-drawer hidden" id="chatDrawer">
  <div class="chat-head"><span class="ring">G</span> Gol <button id="chatClose" type="button" aria-label="Close">×</button></div>
  <div class="chat-body" id="chatBody">
    <div class="msg gol">Hi, I'm Gol. Add an item, ask a price, or say "today's total".</div>
  </div>
  <form class="chat-form" id="chatForm">
    <input id="chatInput" type="text" placeholder="Message Gol…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
